# TailSync dependency maintenance policy.
#
# Security updates remain enabled in repository settings and are not limited
# by the ordinary version-update policy below.
#
# Never add `ignore` or `versioning-strategy: lockfile-only` without reviewing
# their impact on Dependabot security updates.
version: 2

updates:
  # Cargo ordinary version updates are disabled.
  #
  # Reasons:
  # - TailSync has three independent Cargo.lock files.
  # - Rust 0.x minor releases can contain breaking changes.
  # - protocol, persistence and native-platform dependencies require
  #   compatibility or packaged-application validation.
  #
  # Dependabot security updates remain enabled because
  # open-pull-requests-limit applies only to version updates.
  - package-ecosystem: cargo
    directories:
      - /
      - /windows/src-tauri
      - /macos/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"

  # Windows ordinary version updates are disabled. Product/runtime and
  # frontend-toolchain upgrades are reviewed together during planned
  # maintenance. Dependabot security updates remain enabled because this
  # pull-request limit applies only to version updates.
  - package-ecosystem: npm
    directory: /windows
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # Site ordinary version updates are disabled. They are handled during the
  # same planned maintenance review as the Windows frontend.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # Workflow actions.
  #
  # Ordinary updates are manual events because release-only actions cannot be
  # fully exercised by pull-request CI. Security updates remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
