# Dependabot configuration (2026-08 security-audit follow-up).
#
# Monthly version updates across all six dependency surfaces. High-risk
# dependencies (iroh, windows-sys, Tauri) still get their own PRs by name.
# Matching dependencies are grouped only across manifest directories so one
# logical upgrade updates all lockfiles atomically. Never enable auto-merge.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /windows/src-tauri
      - /macos/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cross-workspace-dependencies:
        group-by: dependency-name
    ignore:
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directories:
      - /windows
      - /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cross-project-dependencies:
        group-by: dependency-name
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
