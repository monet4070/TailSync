name: CI timings

# Records per-job/per-step CI durations so test cost trends are visible over
# time. Read-only: it queries the Actions API and uploads artifacts; it never
# commits and never gates a pull request.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Record timings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/record-ci-timings.mjs --repo "$GITHUB_REPOSITORY" --workflow ci.yml --runs 5 --out ci-timings.jsonl
      - name: Summarize slowest jobs
        run: |
          node -e '
            const fs=require("node:fs");
            const rows=fs.readFileSync("ci-timings.jsonl","utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
            const byJob=new Map();
            for(const r of rows){const k=r.job;(byJob.get(k)||byJob.set(k,[]).get(k)).push(r.job_duration_ms||0);}
            const out=[...byJob].map(([job,v])=>({job,runs:v.length,avg_ms:Math.round(v.reduce((a,b)=>a+b,0)/v.length),max_ms:Math.max(...v)}))
              .sort((a,b)=>b.avg_ms-a.avg_ms);
            console.log(JSON.stringify({recorded:rows.length,slowest:out.slice(0,10)},null,2));
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timings
          path: ci-timings.jsonl
          if-no-files-found: error
          retention-days: 30
