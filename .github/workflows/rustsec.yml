name: RustSec audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 06:00 UTC / 14:00 Asia/Shanghai: catches newly published
    # RustSec advisories even when nothing is pushed. Without this, a new
    # advisory is invisible until the next push or PR.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustsec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny advisories (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - .
          - windows/src-tauri
          - macos/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --all-features
          command: check advisories
          manifest-path: ${{ matrix.manifest }}/Cargo.toml

  exceptions:
    name: RustSec exception registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate exception registry against deny.toml
        run: node scripts/check-rustsec-exceptions.mjs .
