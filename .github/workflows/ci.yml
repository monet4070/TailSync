name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Plan CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      frontend_windows: ${{ steps.plan.outputs.frontend_windows }}
      frontend_site: ${{ steps.plan.outputs.frontend_site }}
      rust_windows: ${{ steps.plan.outputs.rust_windows }}
      rust_macos: ${{ steps.plan.outputs.rust_macos }}
      scripts: ${{ steps.plan.outputs.scripts }}
      shared_resolution: ${{ steps.plan.outputs.shared_resolution }}
      rustsec: ${{ steps.plan.outputs.rustsec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test CI scope policy
        run: node --test scripts/ci-scope.test.mjs
      - name: Classify changed paths
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/tailsync-changed-files.zlist"
          force_full=false

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test -n "$BASE_SHA"
            test -n "$HEAD_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            git diff --check "$BASE_SHA...$HEAD_SHA"
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          else
            # Main pushes, manual runs, and release workflow calls retain the
            # complete gate. Only pull requests use path-targeted validation.
            force_full=true
            : > "$changed_files"
          fi

          plan_log="$RUNNER_TEMP/tailsync-ci-plan.txt"
          node scripts/ci-scope.mjs \
            --files "$changed_files" \
            --force-full "$force_full" \
            --github-output "$GITHUB_OUTPUT" | tee "$plan_log"

          {
            echo '### CI scope'
            echo '```text'
            cat "$plan_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-windows:
    name: Frontend (windows)
    needs: changes
    if: needs.changes.outputs.frontend_windows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        working-directory: windows
        run: npm ci
      - name: Lint
        working-directory: windows
        run: npm run lint
      - name: Test
        working-directory: windows
        run: npm test
      - name: Build
        working-directory: windows
        run: npm run build

  frontend-site:
    name: Frontend (site)
    needs: changes
    if: needs.changes.outputs.frontend_site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build
        working-directory: site
        run: npm run build

  rust-windows:
    name: Packaged application (Windows)
    needs: changes
    if: needs.changes.outputs.rust_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Bump the key when adding paths: an existing immutable cache may
          # otherwise hit without containing the new build directories.
          key: windows-checks-and-package-v1
          workspaces: |
            .
            windows/src-tauri
            windows/src-tauri -> target-package
            macos/src-tauri
      - name: Check generated Settings contracts
        run: node shared/schema/generate-settings.mjs --check
      - name: Check cross-platform contracts
        shell: pwsh
        run: ./windows/scripts/check_cross_platform_sync.ps1 -WinRoot ./windows -MacRoot ./macos
      - name: Install Windows frontend dependencies
        working-directory: windows
        run: npm ci
      - name: Build Windows frontend assets
        working-directory: windows
        run: npm run build
      - name: Check shared workspace formatting
        run: cargo fmt --all -- --check
      - name: Run history-classifier crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-history-classifier/Cargo.toml --all-targets -- -D warnings
      - name: Run history-classifier crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-history-classifier/Cargo.toml
      - name: Run protocol crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-protocol/Cargo.toml --all-targets -- -D warnings
      - name: Run protocol crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-protocol/Cargo.toml
      - name: Run theme crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-themes/Cargo.toml --all-targets -- -D warnings
      - name: Run theme crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-themes/Cargo.toml
      - name: Run application runtime Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-runtime/Cargo.toml --all-targets -- -D warnings
      - name: Run application runtime unit tests
        run: cargo test --locked --manifest-path shared/tailsync-runtime/Cargo.toml
      - name: Check Windows application formatting
        run: cargo fmt --manifest-path windows/src-tauri/Cargo.toml --all -- --check
      - name: Check macOS application formatting
        run: cargo fmt --manifest-path macos/src-tauri/Cargo.toml --all -- --check
      - name: Run shared core Clippy
        run: cargo clippy --locked --manifest-path shared/rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Run Windows application Clippy
        run: cargo clippy --locked --manifest-path windows/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run shared core unit tests, including v1 migration fixtures
        run: cargo test --locked --manifest-path shared/rust-core/Cargo.toml
      - name: Run Windows application unit tests
        run: cargo test --locked --manifest-path windows/src-tauri/Cargo.toml --lib
      - name: Check generated Windows Tauri capability schemas
        shell: pwsh
        run: |
          $schemaStatus = @(git status --porcelain --untracked-files=all -- windows/src-tauri/gen/schemas)
          if ($schemaStatus.Count -gt 0) {
            $schemaStatus | Write-Host
            throw 'Windows Tauri capability schemas changed during the build. Regenerate and commit them with stable line endings.'
          }
      - name: Run bidirectional interoperability probe
        shell: pwsh
        run: ./windows/scripts/test_cross_project_interop.ps1 -WinRoot ./windows -MacRoot ./macos
      - name: Build NSIS and run packaged executable/deep-link smoke tests
        shell: pwsh
        run: ./windows/scripts/package-windows.ps1 -SkipChecks
      - name: Upload packaged Windows smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailsync-windows-ci-package
          path: windows/release/*
          if-no-files-found: error
          retention-days: 3

  rust-macos:
    name: Packaged application (macOS)
    needs: changes
    if: needs.changes.outputs.rust_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            macos/src-tauri
      # Keep CI checks explicit so each suite runs once. The local convenience
      # script check_macos_sources.sh still runs the complete local check set.
      - name: Check cross-platform contracts
        run: node windows/scripts/check_cross_platform_sync.mjs --win-root windows --mac-root macos --core-root shared/rust-core
      - name: Check shared workspace formatting
        run: cargo fmt --all -- --check
      - name: Run history-classifier crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-history-classifier/Cargo.toml --all-targets -- -D warnings
      - name: Run history-classifier crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-history-classifier/Cargo.toml
      - name: Run protocol crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-protocol/Cargo.toml --all-targets -- -D warnings
      - name: Run protocol crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-protocol/Cargo.toml
      - name: Run theme crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-themes/Cargo.toml --all-targets -- -D warnings
      - name: Run theme crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-themes/Cargo.toml
      - name: Run application runtime Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-runtime/Cargo.toml --all-targets -- -D warnings
      - name: Run application runtime unit tests
        run: cargo test --locked --manifest-path shared/tailsync-runtime/Cargo.toml
      - name: Run shared core Clippy
        run: cargo clippy --locked --manifest-path shared/rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Run shared core unit tests
        run: cargo test --locked --manifest-path shared/rust-core/Cargo.toml
      - name: Check macOS application formatting
        run: cargo fmt --manifest-path macos/src-tauri/Cargo.toml --all -- --check
      - name: Run macOS application Clippy
        run: cargo clippy --locked --manifest-path macos/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run macOS application unit tests
        run: cargo test --locked --manifest-path macos/src-tauri/Cargo.toml --all-targets
      - name: Check generated macOS Tauri capability schemas
        run: |
          schema_status="$(git status --porcelain --untracked-files=all -- macos/src-tauri/gen/schemas)"
          if [[ -n "$schema_status" ]]; then
            printf '%s\n' "$schema_status"
            echo 'macOS Tauri capability schemas changed during the build.' >&2
            exit 1
          fi
      - name: Run Swift UI unit tests
        env:
          TAILSYNC_WEB_SVG_RENDER_TESTS: "1"
        run: swift test --package-path macos/swift-ui
      - name: Build release Swift UI
        run: swift build -c release --package-path macos/swift-ui
      - name: Build the macOS application bundle
        run: bash macos/build-mac.sh --skip-swift-build
      - name: Verify packaged macOS bundle and daemon
        run: bash macos/scripts/verify_macos_bundle.sh

  scripts:
    name: Release and recovery scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check manual recovery entry points
        run: python -m py_compile windows/scripts/migrate.py macos/scripts/migrate.py shared/scripts/migrate_v1.py
      - name: Run manual v1 recovery functional tests
        run: python -m unittest shared/scripts/test_migrate_v1.py
      - name: Run script regression tests
        run: node --test scripts/*.test.mjs
      - name: Guard dev-only crate features
        run: node scripts/check-production-features.mjs .
      - name: Validate RustSec exception registry
        run: node scripts/check-rustsec-exceptions.mjs .
      - name: Validate dependency update policy
        run: ruby scripts/check-dependabot-policy.rb
      - name: Validate updater trust anchor and endpoints
        run: node scripts/validate-updater-config.mjs --root .
      - name: Validate versioned theme packages
        run: python scripts/validate-theme-packages.py --root .
      - name: Validate checked-in application versions
        run: |
          RELEASE_VERSION="$(node -p "require('./windows/src-tauri/tauri.conf.json').version")"
          node scripts/validate-release-version.mjs --root . --tag "v$RELEASE_VERSION"
      - name: Validate version-file and lockfile consistency (bump-version --check)
        run: |
          RELEASE_VERSION="$(node -p "require('./windows/src-tauri/tauri.conf.json').version")"
          node scripts/bump-version.mjs --root . --target "$RELEASE_VERSION" --check

  shared-resolution:
    name: Shared production dependency resolution
    needs: changes
    if: needs.changes.outputs.shared_resolution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.91.0
      - name: Check shared dependency resolution
        run: node scripts/check-shared-resolution.mjs --root .
      - name: Check local UI contracts
        run: node scripts/check-local-contracts.mjs --root .

  rustsec:
    name: RustSec advisories (${{ matrix.manifest }})
    needs: changes
    if: needs.changes.outputs.rustsec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - .
          - macos/src-tauri
          - windows/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --all-features
          command: check advisories
          manifest-path: ${{ matrix.manifest }}/Cargo.toml

  required-verification:
    name: Required verification
    if: ${{ always() }}
    needs:
      - changes
      - frontend-windows
      - frontend-site
      - rust-windows
      - rust-macos
      - scripts
      - shared-resolution
      - rustsec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_WINDOWS_EXPECTED: ${{ needs.changes.outputs.frontend_windows }}
      FRONTEND_WINDOWS_RESULT: ${{ needs.frontend-windows.result }}
      FRONTEND_SITE_EXPECTED: ${{ needs.changes.outputs.frontend_site }}
      FRONTEND_SITE_RESULT: ${{ needs.frontend-site.result }}
      RUST_WINDOWS_EXPECTED: ${{ needs.changes.outputs.rust_windows }}
      RUST_WINDOWS_RESULT: ${{ needs.rust-windows.result }}
      RUST_MACOS_EXPECTED: ${{ needs.changes.outputs.rust_macos }}
      RUST_MACOS_RESULT: ${{ needs.rust-macos.result }}
      SCRIPTS_EXPECTED: ${{ needs.changes.outputs.scripts }}
      SCRIPTS_RESULT: ${{ needs.scripts.result }}
      SHARED_RESOLUTION_EXPECTED: ${{ needs.changes.outputs.shared_resolution }}
      SHARED_RESOLUTION_RESULT: ${{ needs.shared-resolution.result }}
      RUSTSEC_EXPECTED: ${{ needs.changes.outputs.rustsec }}
      RUSTSEC_RESULT: ${{ needs.rustsec.result }}
    steps:
      - name: Require every selected CI job to succeed
        shell: bash
        run: |
          set -euo pipefail

          test "$CHANGES_RESULT" = success

          require_result() {
            local label="$1"
            local expected="$2"
            local actual="$3"
            printf '%-30s expected=%-5s actual=%s\n' "$label" "$expected" "$actual"
            if [[ "$expected" == "true" ]]; then
              test "$actual" = success
            else
              test "$expected" = false
              test "$actual" = skipped
            fi
          }

          require_result 'Frontend (windows)' "$FRONTEND_WINDOWS_EXPECTED" "$FRONTEND_WINDOWS_RESULT"
          require_result 'Frontend (site)' "$FRONTEND_SITE_EXPECTED" "$FRONTEND_SITE_RESULT"
          require_result 'Packaged application (Windows)' "$RUST_WINDOWS_EXPECTED" "$RUST_WINDOWS_RESULT"
          require_result 'Packaged application (macOS)' "$RUST_MACOS_EXPECTED" "$RUST_MACOS_RESULT"
          require_result 'Release and recovery scripts' "$SCRIPTS_EXPECTED" "$SCRIPTS_RESULT"
          require_result 'Shared production resolution' "$SHARED_RESOLUTION_EXPECTED" "$SHARED_RESOLUTION_RESULT"
          require_result 'RustSec advisories' "$RUSTSEC_EXPECTED" "$RUSTSEC_RESULT"
