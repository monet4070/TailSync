name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [windows, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.project }}
        run: npm run lint
      - name: Test
        if: matrix.project == 'windows'
        working-directory: windows
        run: npm test
      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build

  rust-windows:
    name: Packaged application (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/rust-core
            shared/tailsync-history-classifier
            shared/tailsync-protocol
            shared/tailsync-themes
            windows/src-tauri
            macos/src-tauri
      - name: Check generated Settings contracts
        run: node shared/schema/generate-settings.mjs --check
      - name: Check cross-platform contracts
        shell: pwsh
        run: ./windows/scripts/check_cross_platform_sync.ps1 -WinRoot ./windows -MacRoot ./macos
      - name: Install Windows frontend dependencies
        working-directory: windows
        run: npm ci
      - name: Build Windows frontend assets
        working-directory: windows
        run: npm run build
      - name: Check history-classifier crate formatting
        run: cargo fmt --manifest-path shared/tailsync-history-classifier/Cargo.toml --all -- --check
      - name: Run history-classifier crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-history-classifier/Cargo.toml --all-targets -- -D warnings
      - name: Run history-classifier crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-history-classifier/Cargo.toml
      - name: Check protocol crate formatting
        run: cargo fmt --manifest-path shared/tailsync-protocol/Cargo.toml --all -- --check
      - name: Run protocol crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-protocol/Cargo.toml --all-targets -- -D warnings
      - name: Run protocol crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-protocol/Cargo.toml
      - name: Check theme crate formatting
        run: cargo fmt --manifest-path shared/tailsync-themes/Cargo.toml --all -- --check
      - name: Run theme crate Clippy
        run: cargo clippy --locked --manifest-path shared/tailsync-themes/Cargo.toml --all-targets -- -D warnings
      - name: Run theme crate unit tests
        run: cargo test --locked --manifest-path shared/tailsync-themes/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path shared/rust-core/Cargo.toml --all -- --check
      - name: Check Windows application formatting
        run: cargo fmt --manifest-path windows/src-tauri/Cargo.toml --all -- --check
      - name: Run shared core Clippy
        run: cargo clippy --locked --manifest-path shared/rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Run Windows application Clippy
        run: cargo clippy --locked --manifest-path windows/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run shared core unit tests, including v1 migration fixtures
        run: cargo test --locked --manifest-path shared/rust-core/Cargo.toml
      - name: Run Windows application unit tests
        run: cargo test --locked --manifest-path windows/src-tauri/Cargo.toml --lib
      - name: Run bidirectional interoperability probe
        shell: pwsh
        run: ./windows/scripts/test_cross_project_interop.ps1 -WinRoot ./windows -MacRoot ./macos
      - name: Build NSIS and run the packaged executable smoke test
        shell: pwsh
        run: ./windows/scripts/package-windows.ps1 -InstallDependencies -SkipChecks
      - name: Upload packaged Windows smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tailsync-windows-ci-package
          path: windows/release/*
          if-no-files-found: error
          retention-days: 3

  rust-macos:
    name: Packaged application (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/rust-core
            shared/tailsync-history-classifier
            shared/tailsync-protocol
            shared/tailsync-themes
            macos/src-tauri
      - name: Check macOS sources and cross-platform contracts
        run: bash macos/scripts/check_macos_sources.sh "$GITHUB_WORKSPACE/windows"
      - name: Build the macOS application bundle
        run: bash macos/build-mac.sh --skip-swift-build
      - name: Launch and verify the packaged macOS application
        run: bash macos/scripts/verify_macos_bundle.sh

  scripts:
    name: Release and recovery scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check manual recovery entry points
        run: python -m py_compile windows/scripts/migrate.py macos/scripts/migrate.py shared/scripts/migrate_v1.py
      - name: Run manual v1 recovery functional tests
        run: python -m unittest shared/scripts/test_migrate_v1.py
      - name: Test signed updater manifest generation
        run: node --test scripts/generate-update-manifest.test.mjs scripts/validate-release-version.test.mjs scripts/bump-version.test.mjs
      - name: Validate checked-in application versions
        run: |
          RELEASE_VERSION="$(node -p "require('./windows/src-tauri/tauri.conf.json').version")"
          node scripts/validate-release-version.mjs --root . --tag "v$RELEASE_VERSION"
      - name: Validate version-file and lockfile consistency (bump-version --check)
        run: |
          RELEASE_VERSION="$(node -p "require('./windows/src-tauri/tauri.conf.json').version")"
          node scripts/bump-version.mjs --root . --target "$RELEASE_VERSION" --check
