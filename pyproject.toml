[project]
name = "tailsync"
version = "0.1.0"
description = "基于 Tailscale 网络的跨平台剪贴板同步工具"
readme = "README.md"
# 强制要求 Python 3.12 左右的版本，适配 PyQt5 最好
requires-python = ">=3.9, <3.13" 
dependencies = [
    "PyQt5==5.15.10",
    "pyqt5-qt5==5.15.2",  # 关键：这个版本在 Windows 和 Mac M4 上都有预编译包
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[tool.uv]
# 显式声明环境，防止 Mac 的锁文件导致 Windows 崩溃
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 告诉 uv 你的源码在 src 目录下
[tool.hatch.build.targets.wheel]
packages = ["src/tailsync"]