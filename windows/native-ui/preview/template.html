 function connections(){return `<section class="tsm-section"><h2>${esc(t('connections.title'))}</h2><div class="tsm-settings-group"><div class="tsm-setting">${copy(t('settings.connectionMode'),t('settings.connectionModeDescription'))}${segmented('ts-connection-mode',[['auto',t('settings.modeAuto')],['lan',t('settings.modeLan')],['iroh',t('settings.modeIroh')],['tailscale',t('settings.modeTailscale')]],state.mode)}</div><div class="tsm-setting"><span class="tsm-device-icon">${icon('laptop')}</span><div class="tsm-setting-copy"><h3>MacBook Pro<span class="tsm-local-badge">${esc(t('settings.localDevice'))}</span></h3><p class="tsm-mono">D4:19:8E:2F:70:3A:6B:91</p><p class="tsm-mono">iroh: 9b41c6f8…e731a205</p></div></div><div class="tsm-setting" style="display:block;padding:0"><div class="tsm-peer-count"><span>2 ${esc(t('settings.devices'))}</span><button type="button" class="tsm-outline-button" data-action="refresh" aria-label="${esc(t('settings.refresh'))}">${icon('rotate-cw')}</button></div>${[['DESKTOP-V62KRAF','192.168.1.106 · en0 · 局域网 · 7 ms',true],['Studio PC','离线 · Tailscale',false]].map(([name,status,on])=>`<div class="tsm-peer"><span class="tsm-positive-dot" ${on?'':'style="background:var(--tsm-tertiary)"'}></span><div class="tsm-peer-copy"><h3>${esc(name)}${icon('shield-check')}<span style="font-size:10px;color:var(--tsm-secondary)">${esc(t('settings.paired'))}</span></h3><p>${esc(status)}</p><p class="tsm-mono">8F:62:41:BE:10:D2:59:AC</p></div><button type="button" class="tsm-outline-button" data-action="latency" aria-label="${esc(t('settings.testAllConnections'))}">${icon('move-horizontal')}</button>${button(t('settings.unpair'),'unpair')}${switchControl('',name+' 同步',on)}</div>`).join('')}</div><div class="tsm-setting"><span class="tsm-device-icon">${icon('link-2')}</span>${copy(t('settings.pairDevice'),t('settings.pairingClosed'))}${button(t('settings.allowPairing'),'pair')}</div><div id="ts-remote-drawer" class="tsm-setting tsm-disclosure"><button type="button" data-disclosure="remote" aria-expanded="false"><span class="tsm-device-icon">${icon('globe')}</span>${copy(t('settings.remotePairing'),t('settings.remotePairingDescription'))}${icon('chevron-right')}</button><div id="ts-remote" class="tsm-remote-body" hidden><div class="tsm-setting">${copy(t('settings.createRemoteInvite'),t('settings.createRemoteInviteDescription'))}${button(t('settings.createRemoteInvite'),'invite')}</div><div>${copy(t('settings.useRemoteInvite'),t('settings.useRemoteInviteDescription'))}<input id="ts-invite" class="tsm-invite-input" aria-label="远程配对邀请链接" placeholder="tailsync://pair/v1/..."><div class="tsm-invite-actions">${button(t('settings.checkInvite'),'check-invite')}${button(t('settings.startRemotePairing')||'开始配对','pair')}</div></div></div></div></div></section>`;}

 $('#ts-history-list').innerHTML=visible.length?visible.map(e=>`${e.batch_id?`<div class="tsm-batch">${icon('folder')}<span>${e.batch_total} ${esc(t('history.files'))}</span><button type="button" data-action="restore" data-target="${e.id}">${esc(t('history.copyAll'))}</button></div>`:''}<article class="tsm-row${e.local_only?' tsm-local-only':''}${e.id===state.selected?' is-selected':''}" data-row="${e.id}"><button type="button" class="tsm-entry" data-entry="${e.id}" aria-pressed="${e.id===state.selected}" aria-label="${esc(e.title)}，${esc(kind(e))}"><span class="tsm-row-icon">${e.preview==='image'?`<img src="${landscape}" alt="">`:icon(e.icon==='text'?'file-text':e.icon==='globe'?'link':e.icon)}</span><span class="tsm-row-copy"><span class="tsm-row-header"><span class="tsm-kind">${esc(kind(e))}</span><span>${esc(e.time)}</span><span class="tsm-source">${esc(e.source_peer==='此电脑'?'本机':e.source_peer)}</span>${e.pinned?'<i data-lucide="star" class="tsm-favorite-mark" aria-hidden="true"></i>':''}</span><span class="tsm-description">${esc(e.description)}</span><span class="tsm-size">${e.local_only?'仅本机恢复  ':''}${esc(bytes(e.size_bytes))}</span></span></button>${e.composite?`<div class="tsm-row-actions"><button type="button" class="tsm-icon" data-action="info" data-target="${e.id}" aria-label="${esc(e.title)}的详情">${icon('info')}</button>${!e.local_only?`<button type="button" class="tsm-icon" data-action="entry-menu" data-target="${e.id}" aria-label="选择复制格式" aria-expanded="false">${icon('circle-ellipsis')}${icon('chevron-down')}</button>`:''}</div><div class="tsm-entry-menu" hidden>${button(t('history.composite.copy.text'),'restore')}${button(t('history.composite.copy.png'),'restore')}</div>`:''}<div class="tsm-context-menu" hidden>${button(t('history.restore'),'restore')}${button('预览','preview')}${button(e.pinned?t('history.unpin'):t('history.pin'),'favorite')}${button(t('history.delete'),'delete')}</div></article>`).join(''):`<div class="tsm-empty">${esc(state.collection==='favorites'?t('favorites.emptyTitle'):t('history.empty'))}${state.collection==='favorites'?`<p>${esc(t('favorites.emptyDescription'))}</p>`:''}</div>`;icons();}
 function select(id){state.selected=id;$$('[data-row]').forEach(r=>r.classList.toggle('is-selected',Number(r.dataset.row)===id));$$('[data-entry]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.entry)===id)));}
 function close(){ $('.tsm-modal-layer').hidden=true;dialogAction=null;if(returnFocus?.isConnected)returnFocus.focus(); }
 function dialog(title,body,label='知道了',action=null,pair=false){returnFocus=document.activeElement;dialogAction=action;$('.tsm-popover-window').classList.toggle('tsm-pair-sheet',pair);$('.tsm-popover-window').classList.toggle('tsm-preview-window',title==='Preview');$('.tsm-dialog-actions').hidden=title==='Preview';$('#ts-dialog-title').textContent=title;$('#ts-dialog-content').innerHTML=body;$('#ts-dialog-primary').textContent=label;$('.tsm-modal-layer').hidden=false;icons();(title==='Preview'?$('.tsm-preview-search'):$('#ts-dialog-primary')).focus();}
 function restore(){const e=current();if(e)toast(`已演示恢复「${e.title}」；未更改系统剪贴板`);}
 function preview(){const e=current();if(!e)return;dialog('Preview',`<div class="tsm-preview-heading"><span class="tsm-preview-file-icon">${icon('file-text')}</span><span class="tsm-setting-copy"><strong>${esc(e.title)}</strong><small>${esc(bytes(e.size_bytes))}</small></span><button type="button" class="tsm-outline-button" data-action="restore">${icon('clipboard')}${esc(t('history.preview.restore'))}</button></div><div class="tsm-preview-toolbar"><input class="tsm-preview-search" aria-label="搜索预览" placeholder="搜索"><span class="tsm-footer-spacer"></span><button type="button" class="tsm-small-button" data-preview-font="-1" aria-label="缩小字号">−</button><button type="button" class="tsm-small-button" data-preview-font="1" aria-label="放大字号">+</button><button type="button" class="tsm-small-button" data-action="wrap" aria-label="切换自动换行">${icon('wrap-text')}</button></div><div class="tsm-preview-content">${e.preview==='image'?`<img class="tsm-preview-image" src="${landscape}" alt="山与湖的示例插画">`:''}<p class="tsm-preview-body${e.preview==='code'?' tsm-preview-code':''}">${esc(e.body)}</p></div>`,t('history.preview.restore'),restore);}
 function sync(value){state.sync=value;$('#ts-sync-setting').checked=value;$('[data-action=sync]').setAttribute('aria-pressed',String(value));}
 function applyTheme(theme,save=true){state.theme=theme;root.dataset.theme=theme;$$('[data-segment=ts-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===theme)));if(save)persist();}
 root.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.window){showWindow(b.dataset.window);return;}if(b.dataset.open){showWindow(b.dataset.open);return;}
  if(b.dataset.disclosure){const panel=$('#ts-'+b.dataset.disclosure),open=panel.hidden;panel.hidden=!open;b.setAttribute('aria-expanded',String(open));return;}
  if(b.dataset.segment){const group=b.closest('.tsm-segmented');group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(b.dataset.segment==='ts-theme')applyTheme(b.dataset.value);else {state.mode=b.dataset.value;$('#ts-remote-drawer').hidden=!['auto','iroh'].includes(state.mode);}return;}
  if(b.dataset.colorTheme){state.colorTheme=b.dataset.colorTheme;$$('[data-color-theme]').forEach(x=>{const active=x===b;x.setAttribute('aria-pressed',String(active));x.querySelector('.tsm-theme-check').hidden=!active;});const theme=design.themes.find(x=>x.id===state.colorTheme);root.style.setProperty('--tsm-canvas',`light-dark(${theme.canvas},#191918)`);root.style.setProperty('--tsm-surface',`light-dark(${theme.surface},#232321)`);root.style.setProperty('--tsm-accent',`light-dark(${theme.accent},#ec8668)`);return;}
  if(b.dataset.quota){const q=$('#ts-quota'),n=Math.max(1,Math.min(16384,Number(q.dataset.value)+Number(b.dataset.quota)));q.dataset.value=n;q.textContent=n+' GiB';return;}
  if(b.dataset.previewFont){const p=$('.tsm-preview-body');p.style.fontSize=Math.max(10,Math.min(28,parseFloat(p.style.fontSize||13)+Number(b.dataset.previewFont)))+'px';return;}
  if(b.dataset.entry){select(Number(b.dataset.entry));return;}if(b.dataset.target)select(Number(b.dataset.target));else if(b.closest('[data-row]'))select(Number(b.closest('[data-row]').dataset.row));
  const action=b.dataset.action;
  if(action==='entry-menu'){const menu=b.closest('[data-row]').querySelector('.tsm-entry-menu'),open=menu.hidden;$$('.tsm-entry-menu').forEach(m=>m.hidden=true);menu.hidden=!open;b.setAttribute('aria-expanded',String(open));return;}
  if(action)$$('.tsm-entry-menu,.tsm-context-menu').forEach(m=>m.hidden=true);
  switch(action){
   case 'sync':sync(!state.sync);break;case 'pin':state.pin=!state.pin;b.setAttribute('aria-pressed',String(state.pin));break;case 'favorites':showWindow('favorites');break;case 'restore':restore();break;case 'preview':preview();break;
   case 'favorite':{const e=current();if(e){e.pinned=!e.pinned;render();}break;}
   case 'info':{const e=current();if(!e)break;const pop=$('.tsm-diagnostics');pop.innerHTML=`<h3>${esc(t('history.composite.details'))}</h3>`+[['formats','text / html'],['representations','2'],['images',e.preview==='image'?'1':'0'],['nativeItems','1'],['nativeOnly',e.local_only?'是':'否'],['completeness','完整'],['restorable',e.local_only?'无':'text / html'],['withheld',e.local_only?'原生内容':'无']].map(([key,value])=>`<div class="tsm-diagnostic-row"><span>${esc(t('history.composite.diag.'+key))}</span><span>${esc(value)}</span></div>`).join('');const br=b.getBoundingClientRect(),rr=root.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(br.right-rr.left-260,rr.width-268))+'px';pop.style.top=Math.max(55,br.top-rr.top-250)+'px';pop.hidden=false;break;}
   case 'delete':{const e=current();if(!e)break;if(e.pinned&&state.collection!=='favorites'){toast('收藏受到保护，请到收藏窗口删除');break;}dialog(t('history.delete'),`<p class="tsm-preview-body">${esc(e.title)}</p>`,'删除',()=>{const i=entries.findIndex(x=>x.id===e.id);if(i>=0)entries.splice(i,1);render();});break;}
   case 'clear':dialog('清空所有记录',`<p class="tsm-preview-body">${esc(t('history.confirmClear'))}</p>`,'清空',()=>{for(let i=entries.length-1;i>=0;i--)if(!entries[i].pinned)entries.splice(i,1);render();});break;
   case 'shortcut':{recordCleanup?.();const caps=b.querySelector('.tsm-keycaps'),previous=caps.innerHTML;caps.textContent=t('settings.shortcutRecording');const record=e=>{if(['Shift','Control','Alt','Meta'].includes(e.key))return;e.preventDefault();e.stopImmediatePropagation();if(e.key==='Escape'){caps.innerHTML=previous;}else caps.innerHTML=[e.ctrlKey?'⌃':'',e.altKey?'⌥':'',e.shiftKey?'⇧':'',e.metaKey?'⌘':'',e.key.toUpperCase()].filter(Boolean).map(k=>`<kbd>${esc(k)}</kbd>`).join(' ');root.removeEventListener('keydown',record,true);recordCleanup=null;};recordCleanup=()=>{caps.innerHTML=previous;root.removeEventListener('keydown',record,true);recordCleanup=null;};root.addEventListener('keydown',record,true);break;}
   case 'shortcut-reset':b.closest('.tsm-shortcut-controls').querySelector('.tsm-keycaps').innerHTML='<kbd>⇧</kbd> <kbd>⌘</kbd> <kbd>'+ (b.closest('[data-shortcut]').dataset.shortcut==='syncShortcut'?'S':'H')+'</kbd>';break;
   case 'shortcut-clear':b.closest('.tsm-shortcut-controls').querySelector('.tsm-keycaps').textContent=t('settings.shortcutNone');break;
   case 'update':$('#ts-update-status').textContent='演示：'+t('settings.updateCurrent');break;
   case 'pair':dialog(t('settings.pairDevice'),`${icon('shield-check').replace('<i ','<i class="tsm-pair-shield" ')}<h3>DESKTOP-V62KRAF</h3><div class="tsm-pair-code">829 416</div><p class="tsm-preview-body">${esc(t('settings.compareCode'))}</p><small class="tsm-mono">8F:62:41:BE:10:D2:59:AC</small>`,t('settings.codesMatch'),()=>toast('配对演示完成，未新增真实设备'),true);break;
   case 'invite':case 'check-invite':toast('配对演示：未发送网络请求或创建可用邀请');break;
   case 'latency':toast('演示延迟：7 ms');break;case 'unpair':toast('演示：未移除真实设备');break;case 'refresh':toast('已刷新示例设备');break;
   case 'guide':dialog(t('onboarding.title'),`<p class="tsm-preview-body">${esc(t('onboarding.reopen'))}</p>`);break;
   case 'storage':case 'import-theme':toast('当前为独立界面原型，未打开文件选择或修改真实设置');break;
   case 'wrap':{const p=$('.tsm-preview-body');p.style.whiteSpace=p.style.whiteSpace==='pre'?'pre-wrap':'pre';break;}
   case 'close-dialog':close();break;
  }
  if(b.id==='ts-dialog-primary'){const callback=dialogAction;close();callback?.();}
 });
 root.addEventListener('pointerdown',e=>{if(!e.target.closest('.tsm-diagnostics,[data-action=info]'))$('.tsm-diagnostics').hidden=true;});
 root.addEventListener('focusin',e=>{const b=e.target.closest('[data-entry]');if(b)select(Number(b.dataset.entry));});
 root.addEventListener('contextmenu',e=>{const r=e.target.closest('[data-row]');if(!r)return;e.preventDefault();select(Number(r.dataset.row));$$('.tsm-context-menu').forEach(m=>m.hidden=true);r.querySelector('.tsm-context-menu').hidden=false;});
 $('#ts-search').addEventListener('input',e=>{state.keyword=e.target.value;render();});$('#ts-category').addEventListener('change',e=>{state.category=e.target.value;render();});$('#ts-date').addEventListener('change',e=>{state.date=e.target.value;$('.tsm-custom-dates').hidden=state.date!=='custom';render();});['#ts-date-start','#ts-date-end'].forEach(s=>$(s).addEventListener('change',render));
 root.addEventListener('input',e=>{if(!e.target.matches('.tsm-preview-search'))return;const p=$('.tsm-preview-body'),term=e.target.value,body=current()?.body||'';if(!term){p.textContent=body;return;}let from=0,at,html='';while((at=body.toLowerCase().indexOf(term.toLowerCase(),from))>=0){html+=esc(body.slice(from,at))+'<mark>'+esc(body.slice(at,at+term.length))+'</mark>';from=at+term.length;}p.innerHTML=html+esc(body.slice(from));});
 $('#ts-sync-setting').addEventListener('change',e=>sync(e.target.checked));$('#ts-history-limit').addEventListener('input',e=>{e.target.nextElementSibling.textContent=e.target.value;$('[data-setting=limit] p').textContent=t('settings.limitDescription').replace('{value}',e.target.value);});
 root.addEventListener('dblclick',e=>{const b=e.target.closest('[data-entry]');if(b){select(Number(b.dataset.entry));restore();}});
 root.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(!$('.tsm-modal-layer').hidden){if(e.key==='Tab'){const controls=[...$('.tsm-popover-window').querySelectorAll('button,input,select')].filter(x=>!x.disabled),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(e.key==='Escape'){e.preventDefault();close();}return;}if(e.key==='Escape'){$$('.tsm-entry-menu,.tsm-context-menu,.tsm-diagnostics').forEach(m=>m.hidden=true);return;}if(!['history','favorites'].includes(state.page))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('#ts-search').focus();return;}if(e.target.matches('input,select,textarea')&&e.key!=='ArrowDown')return;if(['ArrowDown','ArrowUp'].includes(e.key)){const list=filtered();if(!list.length)return;e.preventDefault();const i=list.findIndex(x=>x.id===state.selected),next=e.target===$('#ts-search')?0:Math.max(0,Math.min(list.length-1,i+(e.key==='ArrowDown'?1:-1)));select(list[next].id);$(`[data-entry="${state.selected}"]`)?.focus();}else if(e.target.closest('[data-entry]')&&e.key==='Enter'){e.preventDefault();restore();}else if(e.target.closest('[data-entry]')&&e.code==='Space'){e.preventDefault();preview();}});
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.design==='mac-parity'&&['system','light','dark'].includes(s.theme))applyTheme(s.theme,false);});
 root.dataset.theme=state.theme;render();
})();
