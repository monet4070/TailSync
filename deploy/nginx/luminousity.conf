server {
    listen 80;
    listen [::]:80;
    server_name luminousity.online www.luminousity.online dl.luminousity.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name luminousity.online;

    ssl_certificate /etc/letsencrypt/live/luminousity.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminousity.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tailsync-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.luminousity.online;

    ssl_certificate /etc/letsencrypt/live/luminousity.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminousity.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://luminousity.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dl.luminousity.online;

    ssl_certificate /etc/letsencrypt/live/luminousity.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminousity.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/tailsync-downloads;

    location = /teamspeak3.rar {
        alias /var/www/downloads/teamspeak3.rar;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="teamspeak3.rar"' always;
    }

    location = /updates/latest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /releases/ {
        try_files $uri =404;
        add_header Content-Disposition attachment always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
