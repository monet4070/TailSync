<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tailsync-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14130e" />
    <script>
      (() => {
        const storageKey = "tailsync-theme-preference";
        const override = new URLSearchParams(window.location.search).get("theme");
        let stored = null;
        try {
          stored = window.localStorage.getItem(storageKey);
        } catch {
          stored = null;
        }
        const valid = (value) => value === "auto" || value === "light" || value === "dark";
        const preference = valid(override) ? override : valid(stored) ? stored : "auto";
        const hour = new Date().getHours();
        const theme = preference === "auto"
          ? hour >= 7 && hour < 19 ? "light" : "dark"
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "light" ? "#f2f0e9" : "#14130e",
        );
      })();
    </script>
    <meta
      name="description"
      content="TailSync 历史预览支持图片、文本、代码、Markdown、PDF 和 docx，可搜索、翻页和缩放，内容在本地处理，负载上限为 64 MiB。"
    />
    <meta name="application-name" content="TailSync" />
    <link rel="canonical" href="https://luminousity.online/preview.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TailSync" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://luminousity.online/preview.html" />
    <meta property="og:title" content="TailSync 历史预览 - 支持六种常用格式" />
    <meta
      property="og:description"
      content="在独立窗口预览历史中的图片、文本、代码、Markdown、PDF 和 docx，不影响原来的历史列表。"
    />
    <meta property="og:image" content="https://luminousity.online/tailsync-theme-comparison.png" />
    <meta property="og:image:width" content="1512" />
    <meta property="og:image:height" content="1386" />
    <meta property="og:image:alt" content="TailSync 历史预览窗口" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TailSync 历史预览 - 支持六种常用格式" />
    <meta
      name="twitter:description"
      content="在独立窗口预览历史中的图片、文本、代码、Markdown、PDF 和 docx，不影响原来的历史列表。"
    />
    <meta name="twitter:image" content="https://luminousity.online/tailsync-theme-comparison.png" />
    <title>TailSync 历史预览 - 支持六种常用格式</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview/main.tsx"></script>
  </body>
</html>
