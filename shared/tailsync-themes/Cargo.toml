[package]
name = "tailsync-themes"
version = "2.2.2"
description = "Theme package V2 parsing, validation, storage, and resolution for TailSync"
edition = "2021"
license = "MIT"

[dependencies]
blake3 = "1"
fs2 = "0.4"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
