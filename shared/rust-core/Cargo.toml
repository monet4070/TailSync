[package]
name = "tailsync-core"
version = "2.2.2"
description = "Shared storage, identity, crypto, and wire protocol for TailSync"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.23"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
fs2 = "0.4"
hex = "0.4"
# Exact pin: iroh's network behavior across versions needs explicit
# verification (macOS/Windows device pairing over LAN and Tailscale, plus
# the iroh_transport RTT tests) — a compile pass is not enough. Upgrades
# are deliberate, event-driven maintenance PRs with macOS/Windows
# pairing and RTT validation; ordinary Cargo version updates are disabled.
iroh = "=1.1.0"
log = "0.4"
rand = "0.8"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
tailsync-history-classifier = { path = "../tailsync-history-classifier" }
tailsync-protocol = { path = "../tailsync-protocol" }
tailsync-themes = { path = "../tailsync-themes" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
security-framework = "3"
security-framework-sys = "2"

[features]
test-support = []

[dev-dependencies]
proptest = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
